<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>재활감염 Quick Check</title>
<meta name="description" content="치료 전 30초 감염관리 체크 · 재활치료 현장 참고용 도구">
<meta name="theme-color" content="#0F2A47">

<!-- PWA manifest -->
<link rel="manifest" href="./manifest.json">

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png">
<link rel="shortcut icon" href="./favicon.ico">

<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="감염Check">
<link rel="apple-touch-icon" sizes="120x120" href="./icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#0F2A47;
    --navy-2:#173A5E;
    --teal:#1F6F78;
    --mint:#7FD1BE;
    --mint-bg:#EAF7F3;
    --gold:#C9A227;
    --ink:#122031;
    --sub:#5B6B7A;
    --line:#E2E8ED;
    --card:#FFFFFF;
    --bg:#F4F7F8;
    --danger:#B3261E;
    --danger-bg:#FCEBEA;
    --warn:#B5620A;
    --warn-bg:#FDF1E4;
    --info:#1565C0;
    --info-bg:#EAF2FC;
    --ok:#1E7A34;
    --ok-bg:#E9F6EC;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:40px;
    font-size:16px;line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
  }
  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:22px 20px 18px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(15,42,71,0.18);
  }
  header.top .version-badge{
    position:absolute;
    top:10px;
    right:14px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    color:rgba(255,255,255,0.55);
  }
  header.top .eyebrow{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:700;
    margin-bottom:4px;
  }
  header.top h1{
    font-size:22px;
    margin:0 0 2px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:14px;
    color:#C7D7E3;
  }
  .progress{
    display:flex;
    gap:6px;
    margin-top:14px;
  }
  .progress .seg{
    flex:1;
    height:4px;
    border-radius:3px;
    background:rgba(255,255,255,0.22);
    overflow:hidden;
  }
  .progress .seg .fill{
    height:100%;
    width:0%;
    background:var(--mint);
    transition:width .25s ease;
  }
  .progress .seg.done .fill{width:100%;}
  .progress .seg.active .fill{width:100%;}

  main{padding:16px 16px 8px;}
  .step-label{
    font-size:13.5px;
    font-weight:700;
    color:var(--teal);
    letter-spacing:.04em;
    margin:2px 2px 8px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,42,71,0.04);
  }
  .card h2{
    font-size:17.5px;
    margin:0 0 3px;
    font-weight:800;
    color:var(--navy);
  }
  .card .hint{
    font-size:14px;
    color:var(--sub);
    margin:0 0 12px;
    line-height:1.5;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .chip{
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:11px 10px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    text-align:center;
    cursor:pointer;
    transition:all .12s ease;
    line-height:1.35;
    user-select:none;
  }
  .chip:active{transform:scale(0.97);}
  .chip.sel{
    border-color:var(--teal);
    background:var(--mint-bg);
    color:var(--navy);
  }
  .chip.sel::before{
    content:"✓ ";
    color:var(--teal);
    font-weight:800;
  }
  .radio-list{display:flex;flex-direction:column;gap:8px;}
  .radio-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    cursor:pointer;
    background:#fff;
  }
  .radio-row.sel{
    border-color:var(--teal);
    background:var(--mint-bg);
  }
  .radio-row .box{
    width:18px;height:18px;border-radius:5px;
    border:2px solid var(--line);
    flex:0 0 18px;
    margin-top:1px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .radio-row.sel .box{border-color:var(--teal);background:var(--teal);}
  .radio-row.sel .box::after{
    content:"✓";
    color:#fff;
    font-size:13.5px;
    font-weight:800;
    line-height:1;
  }
  .radio-row .txt{font-size:15px;font-weight:600;line-height:1.4;}
  .radio-row .txt small{display:block;font-weight:400;color:var(--sub);font-size:13.5px;margin-top:2px;}

  .alert-note{
    display:flex;gap:8px;
    background:var(--warn-bg);
    border:1px solid #F0D8AF;
    color:var(--warn);
    border-radius:10px;
    padding:9px 11px;
    font-size:13.5px;
    line-height:1.5;
    margin-top:4px;
  }

  footer.nav{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top, var(--bg) 60%, rgba(244,247,248,0));
    padding:10px 16px 16px;
    display:flex;
    gap:10px;
    z-index:10;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:13px;
    padding:14px 10px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .btn.primary{
    background:var(--navy);
    color:#fff;
    box-shadow:0 4px 12px rgba(15,42,71,0.25);
  }
  .btn.primary:disabled{
    background:#A9B7C3;
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn.ghost{
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--navy);
    flex:0 0 84px;
  }
  .btn.restart{
    background:#fff;
    border:1.5px solid var(--navy);
    color:var(--navy);
  }

  /* Result screen */
  .result-banner{
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
    color:#fff;
  }
  .result-banner .kicker{
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.85;
    margin-bottom:6px;
  }
  .result-banner .title{
    font-size:23px;
    font-weight:800;
    line-height:1.3;
    margin-bottom:6px;
  }
  .result-banner .desc{
    font-size:14.5px;
    line-height:1.5;
    opacity:.95;
  }
  .banner-conditional{background:linear-gradient(135deg,#1565C0,#1E88E5);}
  .banner-ward{background:linear-gradient(135deg,#B5620A,#D97F1E);}
  .banner-hold{background:linear-gradient(135deg,#8E1F1A,#B3261E);}
  .status-pill{
    display:inline-block;font-size:13px;font-weight:700;line-height:1.2;
    padding:4px 8px;border-radius:999px;letter-spacing:-.2px;flex-shrink:0;
    white-space:nowrap;
  }
  .pill-conditional{background:#E3F2FD;color:#0D47A1;}
  .pill-ward{background:#FFF3E0;color:#A15C00;}
  .pill-hold{background:#FFEBEE;color:#8E1F1A;}
  .part-status-list{display:flex;flex-direction:column;}
  .part-status-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 2px;border-bottom:1px solid var(--line);
  }
  .part-status-row:last-child{border-bottom:none;padding-bottom:2px;}
  .part-status-row .txt{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4;}
  .part-status-row .txt small{display:block;font-weight:400;color:var(--sub);font-size:13.5px;margin-top:3px;}
  .detail-label{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:-.2px;margin:0 0 8px;}


  .tb-warning{
    background:var(--danger-bg);
    border:1.5px solid #E8AFA9;
    color:var(--danger);
    border-radius:12px;
    padding:12px 13px;
    font-size:14px;
    line-height:1.55;
    margin-bottom:14px;
    font-weight:600;
  }
  .tb-warning b{display:block;font-size:15px;margin-bottom:4px;}

  .info-note{
    background:var(--info-bg);
    border:1.5px solid #B9D3F0;
    color:var(--info);
    border-radius:12px;
    padding:12px 13px;
    font-size:14px;
    line-height:1.55;
    margin-bottom:14px;
    font-weight:600;
  }

  .nurse-traps{background:var(--danger-bg);border:1.5px solid #E8AFA9;color:var(--danger);border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:14px;line-height:1.5;position:sticky;top:0;z-index:5;}
  .nurse-traps .nt-head{font-weight:800;font-size:15px;margin-bottom:4px;}
  .nurse-traps ul{margin:0;padding-left:16px;}
  .nurse-traps b{margin-right:4px;}
  .scenario{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .scenario-off{opacity:.6;}
  .sc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15.5px;margin-bottom:8px;}
  .handoff-box{background:#F5F7FA;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.5;margin-bottom:8px;}
  .btn-copy{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;cursor:pointer;}
  .info-note b{display:block;font-size:15px;margin-bottom:4px;}

  .section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:800;
    color:var(--navy);
    margin:0 0 10px;
  }
  .section-title .ico{
    width:22px;height:22px;
    border-radius:7px;
    background:var(--mint-bg);
    color:var(--teal);
    display:flex;align-items:center;justify-content:center;
    font-size:13.5px;
    font-weight:800;
    flex:0 0 22px;
  }
  ul.list{
    margin:0;padding:0;list-style:none;
    display:flex;flex-direction:column;gap:8px;
  }
  ul.list li{
    font-size:14.5px;
    line-height:1.55;
    padding-left:16px;
    position:relative;
    color:var(--ink);
  }
  ul.list li::before{
    content:"•";
    color:var(--teal);
    font-weight:900;
    position:absolute;
    left:0;
  }
  ul.check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  ul.check li{
    font-size:14.5px;
    line-height:1.5;
    padding-left:22px;
    position:relative;
    color:var(--ink);
  }
  ul.check li::before{
    content:"☐";
    position:absolute;left:0;top:-1px;
    color:var(--teal);
    font-size:15.5px;
  }
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .tag{
    font-size:13px;
    font-weight:700;
    background:var(--mint-bg);
    color:var(--teal);
    padding:4px 9px;
    border-radius:20px;
  }
  .tag.gold{background:#FBF0D3;color:#8A6A0A;}

  .disclaimer{
    background:#fff;
    border:1.5px dashed var(--navy-2);
    border-radius:14px;
    padding:14px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub);
    margin:6px 0 16px;
  }
  .disclaimer b{color:var(--navy);}

  .app-badge{
    text-align:center;
    font-size:12px;
    color:#9AA7B2;
    padding-bottom:6px;
  }

  .subgroup-title{
    font-size:13.5px;
    font-weight:800;
    color:var(--sub);
    letter-spacing:.03em;
    margin:14px 0 8px;
    text-transform:uppercase;
  }
  .subgroup-title:first-child{margin-top:0;}

  .accordion-item{
    border:1.5px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
    overflow:hidden;
    background:#fff;
  }
  .accordion-item:last-child{margin-bottom:0;}
  .accordion-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:12px 13px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    color:var(--navy);
  }
  .accordion-header .chev{
    color:var(--teal);
    font-size:13.5px;
    transition:transform .15s ease;
    flex:0 0 auto;
  }
  .accordion-item.open .accordion-header .chev{transform:rotate(180deg);}
  .accordion-body{
    display:none;
    padding:0 13px 13px;
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink);
  }
  .accordion-item.open .accordion-body{display:block;}

  /* ===== Responsive scaling: phone -> tablet -> PC ===== */

  /* Phones in landscape / small tablets */
  @media (min-width:521px){
    body{padding-bottom:0;}
    .app{
      box-shadow:0 0 40px rgba(15,42,71,0.08);
      min-height:100vh;
    }
  }

  /* Tablets (iPad portrait/landscape, Android tablets) */
  @media (min-width:701px){
    body{
      padding:28px 16px 40px;
      min-height:100vh;
    }
    .app{
      max-width:680px;
      min-height:auto;
      border-radius:20px;
    }
    header.top{padding:26px 28px 22px; border-radius:20px 20px 0 0;}
    header.top h1{font-size:25px;}
    main{padding:22px 28px 10px;}
    .card{padding:20px;}
    .card h2{font-size:19px;}
    .chip-grid{grid-template-columns:repeat(4,1fr);}
    footer.nav{padding:14px 28px 22px;}
    .disclaimer{margin-bottom:10px;}
  }

  /* Desktop / PC */
  @media (min-width:1024px){
    body{
      display:flex;
      justify-content:center;
      padding:40px 16px 56px;
      background:linear-gradient(180deg,#E9EEF1 0%,var(--bg) 260px);
    }
    .app{
      max-width:760px;
      width:760px;
      box-shadow:0 20px 60px rgba(15,42,71,0.14);
    }
    header.top{padding:30px 36px 26px;}
    header.top h1{font-size:27px;}
    header.top .sub{font-size:15px;}
    main{padding:26px 36px 12px;}
    .card{padding:22px 24px;}
    .card h2{font-size:19.5px;}
    .card .hint{font-size:15px;}
    .chip{font-size:16px;padding:13px 12px;cursor:pointer;}
    .chip:hover{border-color:var(--teal);background:var(--mint-bg);}
    .radio-row{padding:13px 14px;}
    .radio-row:hover{border-color:var(--teal);}
    .btn{cursor:pointer;}
    .btn.primary:not(:disabled):hover{background:var(--navy-2);}
    .btn.ghost:hover,.btn.restart:hover{background:var(--mint-bg);}
    .accordion-header:hover{background:#FAFBFC;}
    footer.nav{padding:16px 36px 26px;}
    .result-banner .title{font-size:25px;}
  }

  /* Very large desktop screens */
  @media (min-width:1440px){
    .app{max-width:820px;width:820px;}
  }

  /* iOS safe-area support (notch / home indicator) */
  @supports (padding: max(0px)){
    header.top{
      padding-top:max(22px, calc(env(safe-area-inset-top) + 12px));
    }
    footer.nav{
      padding-bottom:max(16px, calc(env(safe-area-inset-bottom) + 10px));
    }
    body{
      padding-left:max(0px, env(safe-area-inset-left));
      padding-right:max(0px, env(safe-area-inset-right));
    }
  }

  /* Standalone (installed app) mode: no browser chrome, so trim extra outer spacing */
  @media (display-mode: standalone){
    @media (min-width:1024px){
      body{padding-top:24px;}
    }
  }
.comp-sub{margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* =========================================================
   재활감염 Quick Check — 데이터 정의
   근거: 중앙 감염관리지침(2_03·4_08·5_02·5_03 등) + 「재활치료실 감염환자 치료·관리 세부 운영지침(검수용 가안)」
   ※ 질환별 치료장소(CRE 병실만 등)는 내부 운영기준. 본 앱은 지침을 대체하지 않으며 현장 참고용입니다.
   ========================================================= */

const PARTS = [
  {id:'pt', label:'물리치료(PT)', ward:true},
  {id:'ot', label:'작업치료(OT)', ward:false},
  {id:'swallow', label:'연하치료(SW)', ward:false},
  {id:'st', label:'언어치료(ST)', ward:false},
];

const STAFF_ROLES = [
  {id:'doctor', label:'의사직'},
  {id:'nurse', label:'간호직'},
];

const DISEASES = [
  {id:'mrsa', label:'MRSA · CRPA(MRPA) · MRAB', precaution:'contact',
    base:'CONDITIONAL',
    note:'접촉주의. 치료실 조건부 치료 우선은 내부 운영기준. (MRSA·MRPA·MRAB 동일 원칙; 앱 표기 CRPA(MRPA)는 중앙 용어 MRPA와 대응)'},
  {id:'vre', label:'VRE', precaution:'contact_mdro',
    base:'CONDITIONAL_ALT_WARD',
    note:'접촉주의·다제내성균. 가급적 병실 우선·조건 충족 시 치료실 조건부·PT 111병동재활치료실 우선배정 등은 내부 운영기준.'},
  {id:'cre', label:'CRE(CPE)', precaution:'contact_mdro',
    base:'WARD_ONLY_CRE',
    special:true,
    note:'접촉주의·다제내성균. 병실치료만·치료실 내원 원칙적 불가·미운영 파트 보류는 내부 운영기준(격리해제로 풀리는 보류가 아님). 중앙 다제내성균: 1주 이상 간격 연속 3회 음성 시 해제(격리 미해제 재입원 VRE·CRE는 2일 간격 3회). 치료 필요 시 PT 전환은 담당의·감염관리팀 확인.'},
  {id:'cdiff', label:'C. difficile (CDI)', precaution:'contact_cdiff',
    base:'CONDITIONAL',
    note:'접촉주의·아포 형성균. 치료실 조건부 치료 우선은 내부 운영기준.'},
  {id:'tb', label:'활동성/의심 폐·후두 결핵 (배액 있는 폐외 포함)', precaution:'airborne',

  }

  if(result.status==='CONDITIONAL' || result.status==='WARD_ONLY'){
    loc.push('환자 이동은 필요한 범위로 최소화하고, 이동 전 도착 장소와 치료 가능 여부를 확인합니다. 환자의 오염 가능 부위를 덮거나 관리해 공용환경과의 접촉을 최소화하고, 이동에 사용한 휠체어·침상·워커·손잡이 등 접촉면은 사용 후 소독합니다.');
  }

  loc.push(companionNote(d.precaution));
  result.location = loc;
  result.disease = d;

  return result;
}

function decideForPart(diseases, part){
  const perDisease = diseases.map(d=>decideOne(d, part));

  // 가장 제한적인(우선순위 높은) 결과를 전체 기준으로 채택
  let worst = perDisease[0];
  for(const r of perDisease){
    if(STATUS_PRIORITY[r.status] > STATUS_PRIORITY[worst.status]) worst = r;
  }
  const worstDiseases = perDisease.filter(r=>r.status===worst.status).map(r=>r.disease.label);

  const multi = diseases.length > 1;

  // 치료 장소: 모든 질환의 안내를 중복 제거하여 통합
  const locSet = [];
  perDisease.forEach(r=>{
    r.location.forEach(line=>{ if(!locSet.includes(line)) locSet.push(line); });
  });
  if(multi){
    locSet.unshift(`선택한 질환(${diseases.map(d=>d.label).join(', ')}) 중 가장 제한적인 기준(${worstDiseases.join(', ')})을 전체 치료 기준으로 적용합니다.`);
  }

  return {
    status: worst.status,
    title: multi ? `복합 감염 — ${worst.title}` : worst.title,
    desc: worst.desc,
    location: locSet,
  };
}

// 질환의 기본 등급만 간단히 산출 (파트 무관 — 병동 요약용, 세부 치료실 배정 로직 없이 참고 수준)
function baseStatusOf(d){
  if(d.base==='HOLD') return 'HOLD';
  if(d.base.indexOf('WARD_ONLY')===0) return 'WARD_ONLY';
  return 'CONDITIONAL';
}

function buildPrecautionSummary(diseases){
  const precautions = [...new Set(diseases.map(d=>d.precaution))];
  const ppeTag = precautions.map(p=>PRECAUTION_PPE[p].tag).join(' + ');
  const ppeItems = [];
  precautions.forEach(p=>{
    PRECAUTION_PPE[p].ppe.forEach(item=>{ if(!ppeItems.includes(item)) ppeItems.push(item); });
  });
  const companionNotes = [];
  precautions.forEach(p=>{
    const note = companionNote(p);
    if(!companionNotes.includes(note)) companionNotes.push(note);
  });
  return {ppeTag, ppeItems, companionNotes};
}

const NURSE_CHECKLIST = [
  'EMR(BESTCare) 감염 Alert',
  '현재 격리상태(격리실 입구 격리 표지 포함)',
  '감염병 또는 감염균명',
  '감염병 해제 여부',
  '발열·호흡기 증상·피부 병변·설사 등 현재 증상',
  '치료실 이동 가능 여부',
  '병실치료 필요 여부',
  '사용할 장비와 소독 가능 여부',
  '보호자·간병인·이송요원 동반 여부',
  '치료 후 소독시간 확보 가능 여부',
];

function decide(){
  const diseases = DISEASES.filter(x=>state.diseases.includes(x.id));

  if(state.part==='doctor'){
    const perPart = PARTS.map(part=>({part, result: decideForPart(diseases, part)}));
    let worst = perPart[0].result;
    for(const {result} of perPart){
      if(STATUS_PRIORITY[result.status] > STATUS_PRIORITY[worst.status]) worst = result;
    }
    return {role:'doctor', diseases, perPart, status:worst.status, ...buildPrecautionSummary(diseases)};
  }

  if(state.part==='nurse'){
    const statuses = diseases.map(baseStatusOf);
    let status = 'CONDITIONAL';
    if(statuses.includes('HOLD')) status = 'HOLD';
    else if(statuses.includes('WARD_ONLY')) status = 'WARD_ONLY';
    return {role:'nurse', diseases, status, checklist:NURSE_CHECKLIST, ...buildPrecautionSummary(diseases)};
  }

  const part = PARTS.find(p=>p.id===state.part);
  return {role:'therapy', diseases, part, ...decideForPart(diseases, part), ...buildPrecautionSummary(diseases)};
}

function companionNote(precaution){
  const common = '이동 전 오염된 보호구는 제거하고 손위생을 시행하며, 치료 장소에서 직접 접촉이 필요한 경우 청결한 보호구를 새로 착용합니다.';
  switch(precaution){
    case 'contact':
    case 'contact_mdro':
      return `보호자·간병인·이송요원 중 휠체어·침상 또는 환자 주변환경에 직접 접촉하는 경우 손위생 후 긴팔 가운과 장갑을 착용합니다. ${common}`;
    case 'contact_cdiff':
      return `보호자·간병인·이송요원 중 직접 접촉하는 경우 손위생 후 긴팔 가운과 장갑을 착용합니다. 손위생은 가급적 물과 비누로 시행하고(알코올 손소독제 단독 사용 지양), 장갑은 손위생을 대체하지 않습니다. ${common}`;
    case 'droplet':
    case 'droplet_contact':
      return `보호자·간병인·이송요원도 이동·치료 중 마스크를 착용하고, 직접 접촉이 있는 경우 장갑·가운 착용 여부를 함께 확인합니다. ${common}`;
    case 'droplet_air':
      return `보호자·간병인·이송요원도 중앙 최신 격리기준에 따른 마스크(필요 시 호흡기 보호구)를 착용하고 이동 중 환자의 마스크 착용 여부를 확인합니다. ${common}`;
    case 'airborne':
      return `보호자·간병인·이송요원의 이동 동반은 최소화하고, 부득이하게 동반하는 경우 환자의 마스크 착용과 중앙 지침에 따른 호흡기 보호구 착용 여부를 확인합니다. ${common}`;
    default:
      return `보호자·간병인·이송요원에게 필요한 보호구는 담당의·감염관리팀 확인 후 적용합니다. ${common}`;
  }
}

const PRECAUTION_GROUP_ORDER = ['contact','contact_mdro','contact_cdiff','droplet','droplet_contact','unclear'];

function step2HTML(){

  // 추가되더라도(앞으로 질환이 늘어날 경우에 대한 안전장치) 아래에서 누락 없이 모두 표시한다.
  const coveredKeys = [];
  const groupsHTML = PRECAUTION_GROUP_ORDER.map(key=>{
    const list = DISEASES.filter(d=>d.precaution===key && !d.special);
    coveredKeys.push(key);
    if(list.length===0) return '';
    const rows = list.map(d=>`
      <div class="radio-row ${state.diseases.includes(d.id)?'sel':''}" data-disease="${d.id}">
        <div class="box"></div>
        <div class="txt">${d.label}</div>
      </div>
    `).join('');
    return `
      <div class="subgroup-title">${PRECAUTION_PPE[key].tag}</div>
      <div class="radio-list">${rows}</div>
    `;
  }).join('') + (()=>{
    const leftover = DISEASES.filter(d=>!d.special && !coveredKeys.includes(d.precaution));
    if(leftover.length===0) return '';
    const rows = leftover.map(d=>`
      <div class="radio-row ${state.diseases.includes(d.id)?'sel':''}" data-disease="${d.id}">
        <div class="box"></div>
        <div class="txt">${d.label}<small>${PRECAUTION_PPE[d.precaution].tag}</small></div>
      </div>
    `).join('');
    return `<div class="subgroup-title">기타</div><div class="radio-list">${rows}</div>`;
  })();

  const specialList = DISEASES.filter(d=>d.special);
  const specialRows = specialList.map(d=>`
    <div class="radio-row ${state.diseases.includes(d.id)?'sel':''}" data-disease="${d.id}">
      <div class="box"></div>
      <div class="txt">${d.label}<small>${PRECAUTION_PPE[d.precaution].tag}</small></div>
    </div>
  `).join('');

  return `
  <div class="card">
    <h2>감염 유형</h2>
    <p class="hint">전파경로별 주의 유형으로 묶었습니다. 환자에게 해당하는 항목을 모두 선택하세요 (중복 선택 가능).</p>
    ${groupsHTML}
  </div>

  <div class="card">
    <h2>특별 관리가 필요한 감염</h2>
    <p class="hint">격리 단계(유지 중 / 요건 충족 후)에 따라 치료 가능 여부가 달라지는 질환입니다.</p>
    <div class="radio-list">${specialRows}</div>
  </div>
  `;
}

function bindWizardEvents(){
  appEl.querySelectorAll('[data-part]').forEach(el=>{
    el.onclick=()=>{state.part=el.dataset.part; render();};
  });
  appEl.querySelectorAll('[data-disease]').forEach(el=>{
    el.onclick=()=>{
      const id = el.dataset.disease;
      const i = state.diseases.indexOf(id);
      if(i===-1) state.diseases.push(id); else state.diseases.splice(i,1);
      render();
    };
  });
  const back = document.getElementById('btnBack');
  if(back) back.onclick=()=>{state.step--; render(); window.scrollTo(0,0);};
  const next = document.getElementById('btnNext');
  if(next) next.onclick=()=>{
    if(next.disabled) return;
    state.step++; render(); window.scrollTo(0,0);
  };
}

function buildConditions(diseases, role, decision){
  const ids = diseases.map(d=>d.id);
  const core = [
    '환자·보호자·치료사에게 필요한 보호구를 적용할 수 있다.',
    '다른 환자와의 시간적·공간적 접촉을 최소화할 수 있다.',
    '사용할 장비를 최소화할 수 있다.',
    '치료 후 접촉면과 사용장비를 소독할 수 있다.',
    '일과 중 마지막 시간으로 배정하거나, 최대한 마지막에 가깝게 배정할 수 있다.',
    '치료 종료 후 다음 환자 전 소독시간을 확보할 수 있다.'
  ];
  const extras = [];
  if(ids.some(i=>i==='mrsa'||i==='cdiff')) extras.push('접촉주의 환자는 위 공통 조건을 충족할 때 치료실 조건부 치료를 시행할 수 있다.');
  if(ids.includes('vre')) extras.push('VRE: 이동이 어렵거나 치료실 환경관리가 부담되면 병실치료도 대안으로 고려한다. (PT 111병동재활치료실 우선배정은 내부 운영기준)');
  if(ids.includes('flu')) extras.push('독감: 발열·호흡기 증상이 심하면 보류. 증상 호전 후 이동·마스크 유지가 가능해지면 담당의·감염관리팀 확인 후 병실 또는 치료실 조건부 진행.');
  if(ids.includes('cdiff')) extras.push('C. difficile: 손위생은 가급적 물과 비누, 아포 유효 소독제(1:10 락스·바이오스팟·엔지셉트플러스와입스 등)로 접촉면·장비 소독.');
  if(ids.includes('covid')) extras.push('COVID-19: 환자·치료자 마스크, 다른 환자와 거리 확보(필요 시 1인 치료공간).');
  if(ids.includes('scabies')) extras.push('옴: 호흡재활·기침 유발 치료는 보호구 수준 상향 검토.');
  if(role==='therapy' && decision.part && ['ot','swallow','st'].includes(decision.part.id)) extras.push('독립된 치료공간·시간·동선을 분리할 수 있는지 확인한다.');
  let title='조건부 치료 조건 확인', intro='아래 조건을 모두 충족할 수 있을 때 치료실 조건부 치료를 진행하세요.', hint='';
  if(role==='nurse'){ title='조건부 이송 조건 확인'; intro='치료실 이송·치료 전 아래 조건을 충족할 수 있는지 확인하세요.'; }
  if(role==='doctor'){
    title='조건부 처방 시 확인 조건'; intro='조건부인 파트는 아래 조건을 충족할 때 치료실 처방을 참고하세요.';
    const parts=(decision.perPart||[]).filter(x=>x.result.status==='CONDITIONAL').map(x=>x.part.label.split('(')[0].trim());
    if(parts.length) hint='조건부 파트: '+parts.join(' · ');
  }
  return {core, extras, title, intro, hint, source:'출처: 내부 운영참고서 치료실 조건부 치료 조건 · 중앙 「재활치료실 감염관리」와 함께 적용'};
}
function conditionsCardHTML(diseases, role, decision){
  const show = role==='doctor'
    ? (decision.status==='CONDITIONAL' || (decision.perPart||[]).some(x=>x.result.status==='CONDITIONAL'))
    : decision.status==='CONDITIONAL';
  if(!show) return '';
  if(state.expandedTreat.conditions===undefined) state.expandedTreat.conditions = true;

        ${s==='WARD_ONLY'?'<p class="hint">※ 병실치료는 PT만 운영되며, OT·연하·ST 등 미운영 파트는 보류입니다(파트별 결과는 치료직 화면 기준).</p>':''}`:

    </div>`;
  return `<div class="card"><div class="section-title"><span class="ico">2</span>이동 전 — 보호구·동선·동행자</div>${roomCard}${wardCard}</div>`;

function bindResultEvents(){
  document.getElementById('btnRestart').onclick = resetState;
  const cp = document.getElementById('btnCopyHandoff');
  if(cp) cp.onclick = ()=>{
    const t = (document.getElementById('handoffText')||{}).innerText||'';

    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(()=>{});
  };
  document.getElementById('btnPrev').onclick = ()=>{ state.step=2; render(); window.scrollTo(0,0); };
  appEl.querySelectorAll('[data-accordion]').forEach(el=>{
    el.onclick=()=>{
      const id = el.dataset.accordion;
      state.expandedTreat[id] = !state.expandedTreat[id];
      const item = el.closest('.accordion-item');
      if(item) item.classList.toggle('open', !!state.expandedTreat[id]);
    };
  });
}

(function setupInstallBanner(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if(isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
    && !window.MSStream;

  let deferredPrompt = null;
  let banner = null;

  function showBanner(html, onClick){
    if(banner) return;
    banner = document.createElement('div');
    banner.className = 'install-banner';
    banner.innerHTML = `
      <div class="install-banner-text">${html}</div>
      <button class="install-banner-close" aria-label="닫기">✕</button>
    `;
    document.body.appendChild(banner);
    banner.querySelector('.install-banner-close').onclick = ()=>{
      banner.remove(); banner = null;
      try{ sessionStorage.setItem('installBannerDismissed','1'); }catch(e){}
    };
    if(onClick){
      banner.addEventListener('click', (e)=>{
        if(e.target.closest('.install-banner-close')) return;
        onClick();
      });
    }
  }

  let dismissed = false;
  try{ dismissed = sessionStorage.getItem('installBannerDismissed')==='1'; }catch(e){}
  if(dismissed) return;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    showBanner('📲 <b>홈 화면에 앱으로 추가</b>하기 — 탭하여 설치', async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      if(banner){ banner.remove(); banner=null; }
    });
  });

  if(isIOS){
    showBanner('📲 <b>홈 화면에 추가</b>: 하단 공유 버튼 <span style="font-weight:800">⬆️</span> → "홈 화면에 추가" 선택', null);
  }
})();

/* =========================================================
   새 버전 업데이트 알림
   network-first 서비스워커가 새 index.html을 조용히 받아와도,
   이미 열려있는 탭은 새로고침 전까지 옛 버전으로 남아있으므로
   현재 서버의 APP_VERSION과 비교해 알려준다.
   ========================================================= */
(function setupUpdateChecker(){
  let banner = null;

  function extractVersion(html){
    const m = html.match(/const APP_VERSION\s*=\s*'([^']+)'/);
    return m ? m[1] : null;
  }

  function showUpdateBanner(latest){
    if(banner) return;
    banner = document.createElement('div');
    banner.className = 'update-banner';
    banner.innerHTML = `
      <div class="update-banner-text">🔄 새 버전(<b>${latest}</b>)이 있습니다. 새로고침하면 최신 내용이 반영됩니다.</div>
      <button class="update-banner-btn">새로고침</button>
    `;
    document.body.appendChild(banner);
    banner.querySelector('.update-banner-btn').onclick = ()=>{ location.reload(); };
  }

  async function checkForUpdate(){
    try{
      const res = await fetch('./index.html', {cache:'no-store'});
      if(!res.ok) return;
      const html = await res.text();
      const latest = extractVersion(html);
      if(latest && latest !== APP_VERSION) showUpdateBanner(latest);
    }catch(e){ /* 오프라인 등 - 조용히 무시 */ }
  }

  window.addEventListener('load', ()=>{ setTimeout(checkForUpdate, 2000); });
  setInterval(checkForUpdate, 15*60*1000); // 탭을 오래 열어둔 경우 15분마다 재확인
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') checkForUpdate();
  });
})();
</script>
