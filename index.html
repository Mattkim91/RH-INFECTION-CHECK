<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>재활감염 Quick Check</title>
<meta name="description" content="치료 전 30초 감염관리 체크 · 재활치료 현장 참고용 도구">
<meta name="theme-color" content="#0F2A47">

<!-- PWA manifest -->
<link rel="manifest" href="./manifest.json">

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png">
<link rel="shortcut icon" href="./favicon.ico">

<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="감염Check">
<link rel="apple-touch-icon" sizes="120x120" href="./icons/icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --navy:#0F2A47;
    --navy-2:#173A5E;
    --teal:#1F6F78;
    --mint:#7FD1BE;
    --mint-bg:#EAF7F3;
    --gold:#C9A227;
    --ink:#122031;
    --sub:#5B6B7A;
    --line:#E2E8ED;
    --card:#FFFFFF;
    --bg:#F4F7F8;
    --danger:#B3261E;
    --danger-bg:#FCEBEA;
    --warn:#B5620A;
    --warn-bg:#FDF1E4;
    --info:#1565C0;
    --info-bg:#EAF2FC;
    --ok:#1E7A34;
    --ok-bg:#E9F6EC;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:40px;
    font-size:16px;line-height:1.5;
    -webkit-text-size-adjust:100%;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
  }
  header.top{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:22px 20px 18px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 10px rgba(15,42,71,0.18);
  }
  header.top .version-badge{
    position:absolute;
    top:10px;
    right:14px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    color:rgba(255,255,255,0.55);
  }
  header.top .eyebrow{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mint);
    font-weight:700;
    margin-bottom:4px;
  }
  header.top h1{
    font-size:22px;
    margin:0 0 2px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  header.top .sub{
    font-size:14px;
    color:#C7D7E3;
  }
  .progress{
    display:flex;
    gap:6px;
    margin-top:14px;
  }
  .progress .seg-col{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .progress .seg{
    height:4px;
    border-radius:3px;
    background:rgba(255,255,255,0.22);
    overflow:hidden;
  }
  .progress .seg .fill{
    height:100%;
    width:0%;
    background:var(--mint);
    transition:width .25s ease;
  }
  .progress .seg.done .fill{width:100%;}
  .progress .seg.active .fill{width:100%;}
  .progress .seg-cap{
    font-size:11px;
    font-weight:700;
    letter-spacing:.02em;
    color:rgba(255,255,255,.55);
    text-align:center;
    line-height:1.2;
  }
  .progress .seg-col.done .seg-cap,
  .progress .seg-col.active .seg-cap{color:#A7F3D0;}

  main{padding:16px 16px 8px;}
  .step-label{
    font-size:13.5px;
    font-weight:700;
    color:var(--teal);
    letter-spacing:.04em;
    margin:2px 2px 8px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 1px 2px rgba(15,42,71,0.04);
  }
  .card h2{
    font-size:17.5px;
    margin:0 0 3px;
    font-weight:800;
    color:var(--navy);
  }
  .card .hint{
    font-size:14px;
    color:var(--sub);
    margin:0 0 12px;
    line-height:1.5;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .chip{
    font-family:inherit;width:100%;
    border:1.5px solid var(--line);
    background:#fff;
    border-radius:12px;
    padding:11px 10px;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    text-align:center;
    cursor:pointer;
    transition:all .12s ease;
    line-height:1.35;
    user-select:none;
  }
  .chip:active{transform:scale(0.97);}
  .chip.sel{
    border-color:var(--teal);
    background:var(--mint-bg);
    color:var(--navy);
  }
  .chip.sel::before{
    content:"✓ ";
    color:var(--teal);
    font-weight:800;
  }
  .radio-list{display:flex;flex-direction:column;gap:8px;}
  .radio-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    cursor:pointer;
    background:#fff;
  }
  .radio-row.sel{
    border-color:var(--teal);
    background:var(--mint-bg);
  }
  .radio-row .box{
    width:18px;height:18px;border-radius:5px;
    border:2px solid var(--line);
    flex:0 0 18px;
    margin-top:1px;
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .radio-row.sel .box{border-color:var(--teal);background:var(--teal);}
  .radio-row.sel .box::after{
    content:"✓";
    color:#fff;
    font-size:13.5px;
    font-weight:800;
    line-height:1;
  }
  .radio-row .txt{font-size:15px;font-weight:600;line-height:1.4;}
  .radio-row .txt small{display:block;font-weight:400;color:var(--sub);font-size:13.5px;margin-top:2px;}

  .alert-note{
    display:flex;gap:8px;
    background:var(--warn-bg);
    border:1px solid #F0D8AF;
    color:var(--warn);
    border-radius:10px;
    padding:9px 11px;
    font-size:13.5px;
    line-height:1.5;
    margin-top:4px;
  }

  footer.nav{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top, var(--bg) 60%, rgba(244,247,248,0));
    padding:10px 16px 16px;
    display:flex;
    gap:10px;
    z-index:10;
  }
  .btn{
    flex:1;
    border:none;
    border-radius:13px;
    padding:14px 10px;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }
  .btn.primary{
    background:var(--navy);
    color:#fff;
    box-shadow:0 4px 12px rgba(15,42,71,0.25);
  }
  .btn.primary:disabled{
    background:#A9B7C3;
    box-shadow:none;
    cursor:not-allowed;
  }
  .btn.ghost{
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--navy);
    flex:0 0 84px;
  }
  .btn.restart{
    background:#fff;
    border:1.5px solid var(--navy);
    color:var(--navy);
  }

  footer.nav.result-nav .btn{flex:1; width:100%;}
  .restart-wrap{padding:0 16px 10px; text-align:center;}
  .btn-text{
    background:none; border:none; color:var(--teal); font-size:15px; font-weight:700;
    padding:8px 12px; cursor:pointer; font-family:inherit; text-decoration:underline; text-underline-offset:3px;
  }

  /* Result screen */
  .result-banner{
    border-radius:var(--radius);
    padding:18px 16px;
    margin-bottom:14px;
    color:#fff;
  }
  .result-banner .kicker{
    font-size:13.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.85;
    margin-bottom:6px;
  }
  .result-banner .title{
    font-size:23px;
    font-weight:800;
    line-height:1.3;
    margin-bottom:6px;
  }
  .result-banner .desc{
    font-size:14.5px;
    line-height:1.5;
    opacity:.95;
  }
  .banner-conditional{background:linear-gradient(135deg,#1565C0,#1E88E5);}
  .banner-ward{background:linear-gradient(135deg,#B5620A,#D97F1E);}
  .banner-hold{background:linear-gradient(135deg,#8E1F1A,#B3261E);}
  .status-pill{
    display:inline-block;font-size:13px;font-weight:700;line-height:1.2;
    padding:4px 8px;border-radius:999px;letter-spacing:-.2px;flex-shrink:0;
    white-space:nowrap;
  }
  .pill-conditional{background:#E3F2FD;color:#0D47A1;}
  .pill-ward{background:#FFF3E0;color:#A15C00;}
  .pill-hold{background:#FFEBEE;color:#8E1F1A;}
  .part-status-list{display:flex;flex-direction:column;}
  .part-status-row{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 2px;border-bottom:1px solid var(--line);
  }
  .part-status-row:last-child{border-bottom:none;padding-bottom:2px;}
  .part-status-row .txt{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.4;}
  .part-status-row .txt small{display:block;font-weight:400;color:var(--sub);font-size:13.5px;margin-top:3px;}
  .detail-label{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:-.2px;margin:0 0 8px;}


  .tb-warning{
    background:var(--danger-bg);
    border:1.5px solid #E8AFA9;
    color:var(--danger);
    border-radius:12px;
    padding:12px 13px;
    font-size:14px;
    line-height:1.55;
    margin-bottom:14px;
    font-weight:600;
  }
  .tb-warning b{display:block;font-size:15px;margin-bottom:4px;}

  .info-note{
    background:var(--info-bg);
    border:1.5px solid #B9D3F0;
    color:var(--info);
    border-radius:12px;
    padding:12px 13px;
    font-size:14px;
    line-height:1.55;
    margin-bottom:14px;
    font-weight:600;
  }

  .nurse-traps{background:var(--danger-bg);border:1.5px solid #E8AFA9;color:var(--danger);border-radius:12px;padding:10px 13px;margin-bottom:14px;font-size:14px;line-height:1.5;position:sticky;top:0;z-index:5;}
  .nurse-traps .nt-head{font-weight:800;font-size:15px;margin-bottom:4px;}
  .nurse-traps ul{margin:0;padding-left:16px;}
  .nurse-traps b{margin-right:4px;}
  .scenario{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .scenario-off{opacity:.6;}
  .sc-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:15.5px;margin-bottom:8px;}
  .rx-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .rx-cell{background:#fff;border-radius:10px;padding:10px 12px;border:2px solid var(--line);color:#1a1a1a;}
  .rx-cell.pill-conditional{border-color:#2E9E5B;} .rx-cell.pill-ward{border-color:#E08A00;} .rx-cell.pill-hold{border-color:#C62828;}
  .rx-part{font-size:15px;font-weight:700;} .rx-verdict{font-size:17px;font-weight:800;margin-top:2px;}
  .rx-cell.pill-conditional .rx-verdict{color:#1F7A44;} .rx-cell.pill-ward .rx-verdict{color:#B36B00;} .rx-cell.pill-hold .rx-verdict{color:#C62828;}
  .handoff-box{background:#F5F7FA;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.5;margin-bottom:8px;}
  .info-note b{display:block;font-size:15px;margin-bottom:4px;}

  .section-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:800;
    color:var(--navy);
    margin:0 0 10px;
  }
  .section-title .ico{
    width:22px;height:22px;
    border-radius:7px;
    background:var(--mint-bg);
    color:var(--teal);
    display:flex;align-items:center;justify-content:center;
    font-size:13.5px;
    font-weight:800;
    flex:0 0 22px;
  }
  ul.list{
    margin:0;padding:0;list-style:none;
    display:flex;flex-direction:column;gap:8px;
  }
  ul.list li{
    font-size:14.5px;
    line-height:1.55;
    padding-left:16px;
    position:relative;
    color:var(--ink);
  }
  ul.list li::before{
    content:"•";
    color:var(--teal);
    font-weight:900;
    position:absolute;
    left:0;
  }
  ul.check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  ul.check li{
    font-size:14.5px;
    line-height:1.5;
    padding-left:22px;
    position:relative;
    color:var(--ink);
  }
  ul.check li::before{
    content:"☐";
    position:absolute;left:0;top:-1px;
    color:var(--teal);
    font-size:15.5px;
  }
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .tag{
    font-size:13px;
    font-weight:700;
    background:var(--mint-bg);
    color:var(--teal);
    padding:4px 9px;
    border-radius:20px;
  }
  .tag.gold{background:#FBF0D3;color:#8A6A0A;}

  .disclaimer{
    background:#fff;
    border:1.5px dashed var(--navy-2);
    border-radius:14px;
    padding:14px;
    font-size:14px;
    line-height:1.6;
    color:var(--sub);
    margin:6px 0 16px;
  }
  .disclaimer b{color:var(--navy);}

  .app-badge{
    text-align:center;
    font-size:12px;
    color:#9AA7B2;
    padding-bottom:6px;
  }

  .subgroup-title{
    font-size:13.5px;
    font-weight:800;
    color:var(--sub);
    letter-spacing:.03em;
    margin:14px 0 8px;
    text-transform:uppercase;
  }
  .subgroup-title:first-child{margin-top:0;}

  .accordion-item{
    border:1.5px solid var(--line);
    border-radius:12px;
    margin-bottom:8px;
    overflow:hidden;
    background:#fff;
  }
  .accordion-item:last-child{margin-bottom:0;}
  .accordion-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:12px 13px;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    color:var(--navy);
  }
  .accordion-header .chev{
    color:var(--teal);
    font-size:13.5px;
    transition:transform .15s ease;
    flex:0 0 auto;
  }
  .accordion-item.open .accordion-header .chev{transform:rotate(180deg);}
  .accordion-body{
    display:none;
    padding:0 13px 13px;
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink);
  }
  .accordion-item.open .accordion-body{display:block;}


  /* Short landscape (phone sideways): free vertical space */
  @media (orientation:landscape) and (max-height:500px){
    header.top{position:static;}
  }
  /* ===== Responsive scaling: phone -> tablet -> PC ===== */

  /* Phones in landscape / small tablets */
  @media (min-width:521px){
    body{padding-bottom:0;}
    .app{
      box-shadow:0 0 40px rgba(15,42,71,0.08);
      min-height:100vh;
      min-height:100dvh;
    }
  }

  /* Tablets (iPad portrait/landscape, Android tablets) */
  @media (min-width:701px){
    body{
      padding:28px 16px 40px;
      min-height:100vh;
      min-height:100dvh;
    }
    .app{
      max-width:680px;
      min-height:auto;
      border-radius:20px;
    }
    header.top{padding:26px 28px 22px; border-radius:20px 20px 0 0;}
    header.top h1{font-size:25px;}
    main{padding:22px 28px 10px;}
    .card{padding:20px;}
    .card h2{font-size:19px;}
    .chip-grid{grid-template-columns:repeat(4,1fr);}
    footer.nav{padding:14px 28px 22px;}
    .disclaimer{margin-bottom:10px;}
  }

  /* Desktop / PC */
  @media (min-width:1024px){
    body{
      display:flex;
      justify-content:center;
      padding:40px 16px 56px;
      background:linear-gradient(180deg,#E9EEF1 0%,var(--bg) 260px);
    }
    .app{
      max-width:760px;
      width:760px;
      box-shadow:0 20px 60px rgba(15,42,71,0.14);
    }
    header.top{padding:30px 36px 26px;}
    header.top h1{font-size:27px;}
    header.top .sub{font-size:15px;}
    main{padding:26px 36px 12px;}
    .card{padding:22px 24px;}
    .card h2{font-size:19.5px;}
    .card .hint{font-size:15px;}
    .chip{font-size:16px;padding:13px 12px;cursor:pointer;}
    .chip:hover{border-color:var(--teal);background:var(--mint-bg);}
    .radio-row{padding:13px 14px;}
    .radio-row:hover{border-color:var(--teal);}
    .btn{cursor:pointer;}
    .btn.primary:not(:disabled):hover{background:var(--navy-2);}
    .btn.ghost:hover,.btn.restart:hover{background:var(--mint-bg);}
    .accordion-header:hover{background:#FAFBFC;}
    footer.nav{padding:16px 36px 26px;}
    .result-banner .title{font-size:25px;}
  }

  /* Very large desktop screens */
  @media (min-width:1440px){
    .app{max-width:820px;width:820px;}
  }

  /* iOS safe-area support (notch / home indicator) */
  @supports (padding: max(0px)){
    header.top{
      padding-top:max(22px, calc(env(safe-area-inset-top) + 12px));
    }
    footer.nav{
      padding-bottom:max(16px, calc(env(safe-area-inset-bottom) + 10px));
    }
    body{
      padding-left:max(0px, env(safe-area-inset-left));
      padding-right:max(0px, env(safe-area-inset-right));
    }
  }

  /* Standalone (installed app) mode: no browser chrome, so trim extra outer spacing */
  @media (display-mode: standalone){
    @media (min-width:1024px){
      body{padding-top:24px;}
    }
  }
.comp-sub{margin-top:14px}

/* ===== v1.20 UI refresh ===== */
:root{--navy:#0B2540;--navy-2:#14406A;--teal:#0F766E;--mint:#5EEAD4;--mint-bg:#ECFDF8;--ink:#0F1C2B;--sub:#55687A;--line:#E3E9EF;--bg:#F3F6F9;--radius:18px;
  --sh-1:0 1px 2px rgba(11,37,64,.04),0 2px 8px rgba(11,37,64,.05);--sh-2:0 6px 24px rgba(11,37,64,.10);}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI","Malgun Gothic",Roboto,sans-serif;letter-spacing:-.01em;background:var(--bg);}
header.top{background:radial-gradient(120% 140% at 100% 0%,#1C5A8C 0%,rgba(28,90,140,0) 55%),linear-gradient(160deg,#0B2540 0%,#12385E 100%);padding:20px 20px 16px;box-shadow:0 8px 24px rgba(11,37,64,.22);border-radius:0 0 22px 22px;}
header.top .version-badge{top:12px;right:14px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.18);}
header.top .eyebrow{color:var(--mint);font-size:12.5px;}
header.top h1{font-size:23px;letter-spacing:-.02em;}
.progress .seg{height:5px;background:rgba(255,255,255,.16);}
.progress .seg-cap{font-size:12px;}
.progress .seg .fill{background:linear-gradient(90deg,#5EEAD4,#A7F3D0);}
main{padding:18px 16px 8px;}
.step-label{font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.08em;}
.card{border:1px solid rgba(227,233,239,.9);border-radius:var(--radius);padding:18px;box-shadow:var(--sh-1);margin-bottom:14px;}
.card h2{font-size:18.5px;letter-spacing:-.02em;color:var(--navy);}
.card .hint{font-size:15px;}
.chip-grid{gap:10px;}
.chip{min-height:52px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:14px;font-size:16px;padding:12px 10px;box-shadow:0 1px 0 rgba(11,37,64,.03);transition:border-color .15s,background .15s,box-shadow .15s,transform .1s;}
.chip.sel{border-color:var(--teal);background:var(--mint-bg);color:var(--navy);box-shadow:0 0 0 3px rgba(15,118,110,.12);}
.radio-row{min-height:52px;border-radius:14px;padding:13px 14px;transition:border-color .15s,background .15s;}
.radio-row.sel{box-shadow:0 0 0 3px rgba(15,118,110,.12);}
.radio-row .txt{font-size:16px;}

      loc.push('타과입원환자: 병실물리치료만 시행합니다.');

    }else if(hasWard){
      loc.push('운동치료실에서 다른 환자와의 시간적·공간적 접촉을 최소화하여 치료를 진행합니다. 이동이 어렵거나 치료실 환경관리가 충분하지 않은 경우에는 병실PT도 대안으로 고려할 수 있습니다.');
    }else{
      loc.push(`${part.label}는 병실방문치료 프로그램을 운영하지 않으므로, 치료실 내원이 허용된 경우 독립된 치료공간에서 시행합니다.`);
      if(part.id==='ot') loc.push('작업치료실 내 독립된 치료공간을 우선 활용하고 다른 환자와 치료시간·동선을 분리합니다.');
      if(part.id==='swallow') loc.push('작업치료실 내 독립된 치료공간에서 시행하며, 비산 위험이 있는 경우 안면 보호구 등 추가 보호구를 적용합니다.');
      if(part.id==='st') loc.push('1:1 독립 치료실에서 환자 간 치료시간과 이동 동선이 겹치지 않도록 조정합니다.');
    }
  }else if(result.status==='HOLD'){
    loc.push('확인 전까지 치료를 시작하지 않습니다. 병동 또는 담당의 확인 → 필요 시 감염관리팀 문의 순서로 진행합니다.');
  }

  if(result.status==='CONDITIONAL' || result.status==='WARD_ONLY'){
    loc.push('환자 이동은 필요한 범위로 최소화하고, 이동 전 도착 장소와 치료 가능 여부를 확인합니다. 환자의 오염 가능 부위를 덮거나 관리해 공용환경과의 접촉을 최소화하고, 이동에 사용한 휠체어·침상·워커·손잡이 등 접촉면은 사용 후 소독합니다.');
  }

  loc.push(companionNote(d.precaution));
  result.location = loc;
  result.disease = d;

  return result;
}

function decideForPart(diseases, part){
  const perDisease = diseases.map(d=>decideOne(d, part));

  // 가장 제한적인(우선순위 높은) 결과를 전체 기준으로 채택
  let worst = perDisease[0];
  for(const r of perDisease){
    if(STATUS_PRIORITY[r.status] > STATUS_PRIORITY[worst.status]) worst = r;
  }
  const worstDiseases = perDisease.filter(r=>r.status===worst.status).map(r=>r.disease.label);

  const multi = diseases.length > 1;

  // 치료 장소: 모든 질환의 안내를 중복 제거하여 통합
  const locSet = [];
  perDisease.forEach(r=>{
    r.location.forEach(line=>{ if(!locSet.includes(line)) locSet.push(line); });
  });
  if(multi){
    locSet.unshift(`선택한 질환(${diseases.map(d=>d.label).join(', ')}) 중 가장 제한적인 기준(${worstDiseases.join(', ')})을 전체 치료 기준으로 적용합니다.`);
  }

  return {
    status: worst.status,
    title: multi ? `복합 감염 — ${worst.title}` : worst.title,
    desc: worst.desc,
    location: locSet,
  };
}

// 질환의 기본 등급만 간단히 산출 (파트 무관 — 병동 요약용, 세부 치료실 배정 로직 없이 참고 수준)
function baseStatusOf(d){
  if(d.base.indexOf('HOLD')===0) return 'HOLD';
  if(d.base.indexOf('WARD_ONLY')===0) return 'WARD_ONLY';
  return 'CONDITIONAL';
}

function buildPrecautionSummary(diseases){
  const precautions = [...new Set(diseases.map(d=>d.precaution))];
  const ppeTag = precautions.map(p=>PRECAUTION_PPE[p].tag).join(' + ');
  const ppeItems = [];
  precautions.forEach(p=>{
    PRECAUTION_PPE[p].ppe.forEach(item=>{ if(!ppeItems.includes(item)) ppeItems.push(item); });
  });
  const companionNotes = [];
  precautions.forEach(p=>{
    const note = companionNote(p);
    if(!companionNotes.includes(note)) companionNotes.push(note);
  });
  return {ppeTag, ppeItems, companionNotes};
}

const NURSE_CHECKLIST = [
  'EMR(BESTCare) 감염 Alert',
  '현재 격리상태(격리실 입구 격리 표지 포함)',
  '감염병 또는 감염균명',
  '감염병 해제 여부',
  '발열·호흡기 증상·피부 병변·설사 등 현재 증상',
  '치료실 이동 가능 여부',
  '병실PT 필요 여부',
  '사용할 장비와 소독 가능 여부',
  '보호자·간병인·이송요원 동반 여부',
  '치료 후 소독시간 확보 가능 여부',
];

function decide(){
  const diseases = DISEASES.filter(x=>state.diseases.includes(x.id));

  if(state.part==='doctor'){
    const perPart = PARTS.map(part=>({part, result: decideForPart(diseases, part)}));
    let worst = perPart[0].result;
    for(const {result} of perPart){
      if(STATUS_PRIORITY[result.status] > STATUS_PRIORITY[worst.status]) worst = result;
    }
    return {role:'doctor', diseases, perPart, status:worst.status, ...buildPrecautionSummary(diseases)};
  }

  if(state.part==='nurse'){
    const statuses = diseases.map(baseStatusOf);
    let status = 'CONDITIONAL';
    if(statuses.includes('HOLD')) status = 'HOLD';
    else if(statuses.includes('WARD_ONLY')) status = 'WARD_ONLY';
    return {role:'nurse', diseases, status, checklist:NURSE_CHECKLIST, ...buildPrecautionSummary(diseases)};
  }

  const part = PARTS.find(p=>p.id===state.part);
  return {role:'therapy', diseases, part, ...decideForPart(diseases, part), ...buildPrecautionSummary(diseases)};
}

  const common = '이동 전 오염된 보호구는 제거하고 손위생을 시행하며, 치료 장소에서 직접 접촉이 필요한 경우 청결한 보호구를 새로 착용합니다.';
  switch(precaution){
    case 'contact':
    case 'contact_mdro':
      return `보호자·간병인·이송요원 중 휠체어·침상 또는 환자 주변환경에 직접 접촉하는 경우 손위생 후 긴팔 가운과 장갑을 착용합니다. ${common}`;
    case 'contact_cdiff':
      return `보호자·간병인·이송요원 중 직접 접촉하는 경우 손위생 후 긴팔 가운과 장갑을 착용합니다. 손위생은 가급적 물과 비누로 시행하고(알코올 손소독제 단독 사용 지양), 장갑은 손위생을 대체하지 않습니다. ${common}`;
    case 'droplet':
    case 'droplet_contact':
      return `보호자·간병인·이송요원도 이동·치료 중 마스크를 착용하고, 직접 접촉이 있는 경우 장갑·가운 착용 여부를 함께 확인합니다. ${common}`;
    case 'droplet_air':
      return `보호자·간병인·이송요원도 최신 격리기준에 따른 마스크(필요 시 호흡기 보호구)를 착용하고 이동 중 환자의 마스크 착용 여부를 확인합니다. ${common}`;
    case 'airborne':
      return `보호자·간병인·이송요원의 이동 동반은 최소화하고, 부득이하게 동반하는 경우 환자의 마스크 착용과 중앙 지침에 따른 호흡기 보호구 착용 여부를 확인합니다. ${common}`;
    default:
      return `보호자·간병인·이송요원에게 필요한 보호구는 담당의·감염관리팀 확인 후 적용합니다. ${common}`;
  }
}

    if(raw && raw.includes(normSearch('CRAB'))) hs.push('CRAB: 「MRSA / CRPA(MRPA) / MRAB」 칩(접촉주의)으로 판정합니다.');
    hintEl.innerHTML = hs.join('<br>'); setDisp(hintEl, hs.length ? '' : 'none');
  }
  const em = document.getElementById('diseaseEmpty');
  if(em) setDisp(em, anyVis ? 'none' : '');

}

function renderSelStrip(){
  const el = document.getElementById('selStrip');
  if(!el) return;
  if(!state.diseases.length){ el.innerHTML=''; setDisp(el,'none'); return; }
  setDisp(el,'');
  el.innerHTML = '<span class="sel-strip-lab">선택됨:</span>' + state.diseases.map(id=>{
    const d = DISEASES.find(x=>x.id===id); const lab = d ? d.label : id;
    return `<button type="button" class="sel-pill" data-unsel="${id}" aria-label="${lab} 선택 해제">${lab} ✕</button>`;
  }).join('');
  Array.from(el.querySelectorAll('[data-unsel]')||[]).forEach(b=>{ b.onclick=()=>toggleDisease(b.dataset.unsel); });
}
function syncDiseaseRow(id){
  const on = state.diseases.includes(id);
  Array.from(appEl.querySelectorAll('.radio-row[data-disease]')||[]).forEach(el=>{
    if((el.dataset||{}).disease!==id) return;
    el.classList.toggle('sel', on);
    if(el.setAttribute) el.setAttribute('aria-checked', String(on));
  });
  const next = document.getElementById('btnNext');
  if(next) next.disabled = state.diseases.length===0;
}
function toggleDisease(id, forceOn){
  const i = state.diseases.indexOf(id);
  if(i===-1) state.diseases.push(id); else if(!forceOn) state.diseases.splice(i,1);
  syncDiseaseRow(id);
  filterDiseaseRows();
}

function bindWizardEvents(){
  appEl.querySelectorAll('[data-part]').forEach(el=>{
    el.onclick=()=>{state.part=el.dataset.part; goStep(2);};
  });
  appEl.querySelectorAll('[data-disease]').forEach(el=>{
    el.onclick=()=>toggleDisease(el.dataset.disease);
    el.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ e.preventDefault(); toggleDisease(el.dataset.disease); } };
  });
  const po = document.getElementById('btnPickOther');
  if(po) po.onclick=()=>{
    state.diseaseQuery='';
    const inp=document.getElementById('diseaseSearch'); if(inp) inp.value='';
    toggleDisease('other', true);
  };
  const ds = document.getElementById('diseaseSearch');
  if(ds){
    ds.value = state.diseaseQuery;
    ds.oninput=()=>{ state.diseaseQuery = ds.value; filterDiseaseRows(); };
    const sb = document.getElementById('diseaseSearchBtn');
    if(sb) sb.onclick=()=>{ if(state.diseaseQuery){ state.diseaseQuery=''; ds.value=''; filterDiseaseRows(); } ds.focus(); };
    filterDiseaseRows();
  }
  const back = document.getElementById('btnBack');
  if(back) back.onclick=()=>goBack();
  const next = document.getElementById('btnNext');
  if(next) next.onclick=()=>{
    if(next.disabled) return;
    goStep(state.step+1);
  };
}

function buildConditions(diseases, role, decision){
  const ids = diseases.map(d=>d.id);
  const core = [
    '환자·보호자·치료사에게 필요한 보호구를 적용할 수 있다.',
    '다른 환자와의 시간적·공간적 접촉을 최소화할 수 있다.',
    '사용할 장비를 최소화할 수 있다.',
    '치료 후 접촉면과 사용장비를 소독할 수 있다.',
    '일과 중 마지막 시간으로 배정하거나, 최대한 마지막에 가깝게 배정할 수 있다.',
    '치료 종료 후 다음 환자 전 소독시간을 확보할 수 있다.'
  ];
  const extras = [];
  if(ids.some(i=>i==='mrsa'||i==='cdiff')) extras.push('접촉주의 환자는 위 공통 조건을 충족할 때 치료실 조건부 치료를 시행할 수 있다.');
  if(ids.includes('vre')) extras.push('VRE: 이동이 어렵거나 치료실 환경관리가 부담되면 병실PT도 대안으로 고려한다.');
  if(ids.includes('flu')) extras.push('독감: 발열·호흡기 증상이 심하면 보류. 증상 호전 후 이동·마스크 유지가 가능해지면 담당의·감염관리팀 확인 후 병실 또는 치료실 조건부 진행.');
  if(ids.includes('rota_noro')) extras.push('로타·노로: 손위생은 가급적 물과 비누(노로는 알코올 효과 낮을 수 있음), 접촉면·장비 소독.');
  if(ids.includes('cdiff')) extras.push('C. difficile: 손위생은 가급적 물과 비누, 아포 유효 소독제(1:10 락스·바이오스팟·엔지셉트플러스와입스 등)로 접촉면·장비 소독.');
  if(ids.includes('covid')) extras.push('COVID-19: 환자·치료자 마스크, 다른 환자와 거리 확보(필요 시 1인 치료공간).');
  if(ids.includes('other_airborne')) extras.push('기타 공기주의(수두·홍역·파종성 대상포진): 직원 N95(동급)·Fit check, 병실물리치료만. 국소 대상포진·결핵과 구분.');
  if(ids.includes('other_droplet')) extras.push('기타 비말주의(백일해·성홍열·이하선염·수막구균·풍진): 일반 마스크, 병실물리치료만. 독감·COVID와 구분.');
  if(ids.includes('scabies')) extras.push('옴: 호흡재활·기침 유발 치료는 보호구 수준 상향 검토.');
  if(role==='therapy' && decision.part && ['ot','swallow','st'].includes(decision.part.id)) extras.push('독립된 치료공간·시간·동선을 분리할 수 있는지 확인한다.');
  let title='조건부 치료 조건 확인', intro='아래 조건을 모두 충족할 수 있을 때 치료실 조건부 치료를 진행하세요.', hint='';
  if(role==='nurse'){ title='조건부 이송 조건 확인'; intro='치료실 이송·치료 전 아래 조건을 충족할 수 있는지 확인하세요.'; }
  if(role==='doctor'){

    const parts=(decision.perPart||[]).filter(x=>x.result.status==='CONDITIONAL').map(x=>x.part.label.split('(')[0].trim());
    if(parts.length) hint='조건부 파트: '+parts.join(' · ');
  }
  return {core, extras, title, intro, hint};
}

function verdictTitleHTML(t){
  t=String(t||'');
  const i=t.indexOf(' — '), j=t.indexOf(' (');
  let main=t, sub='';
  if(j>-1 && (i<0 || j<i)){main=t.slice(0,j);sub=t.slice(j+1);}
  else if(i>-1){main=t.slice(0,i);sub=t.slice(i+3);}
  return `<span class="verdict-main">${main}</span>${sub?`<span class="verdict-sub">${sub}</span>`:''}`;
}

    : s==='WARD_ONLY' ? '이 경로로 진행 · 작업·연하·언어 불가' : '필요 시 대안';
  return `<div class="card"><div class="section-title"><span class="ico">2</span>어디서 치료하나</div>

  </div>`;
}

/* v1.23 뒤로가기(스와이프·시스템 back) 트랩 — 화면 단계와 history 동기화 */
function histPush(step){ try{ history.pushState({qcStep:step}, '', location.pathname + location.search + '#'+step); }catch(e){} }
function histReplace(step){ try{ history.replaceState({qcStep:step}, '', location.pathname + location.search + '#'+step); }catch(e){} }
function goStep(n){ state.step=n; histPush(n); render(); window.scrollTo(0,0); }
// 화면 '이전' = 시스템 뒤로가기와 동일 → popstate가 화면을 갱신 (스택 일치)
function goBack(){
  if(state.step<=1) return;
  if(history.state && history.state.qcStep===state.step && state.step>1){ history.back(); }
  else { state.step--; histReplace(state.step); render(); window.scrollTo(0,0); }
}
function restartAll(){
  const depth = state.step-1;
  resetState();
  if(depth>0 && history.state && history.state.qcStep>1){ ignorePops = 1; history.go(-depth); }
  else histReplace(1);
}
let ignorePops = 0, exiting = false;
window.addEventListener('popstate', (e)=>{
  if(exiting) return;
  if(ignorePops>0){ ignorePops--; return; }
  const target = e.state && e.state.qcStep;
  if(target && target>=1 && target<state.step){
    state.step = target; render(); window.scrollTo(0,0); return;
  }
  if(state.step>1){ state.step = Math.max(1, target||state.step-1); histReplace(state.step); render(); window.scrollTo(0,0); return; }
  // 첫 화면에서 뒤로 → 종료 확인 (트랩 아래로 내려온 상태)
  if(confirm('앱을 종료할까요?')){ exiting = true; history.back(); }
  else { histPush(1); }
});

function bindResultEvents(){
  document.getElementById('btnRestart').onclick = ()=>restartAll();
  document.getElementById('btnPrev').onclick = ()=>goBack();
  appEl.querySelectorAll('[data-accordion]').forEach(el=>{
    el.onclick=()=>{
      const id = el.dataset.accordion;
      state.expandedTreat[id] = !state.expandedTreat[id];
      const item = el.closest('.accordion-item');
      if(item) item.classList.toggle('open', !!state.expandedTreat[id]);
      if(el.setAttribute) el.setAttribute('aria-expanded', String(!!state.expandedTreat[id]));
    };
    el.onkeydown=(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.onclick(); } };
  });
}

render();
// 첫 로드: 기준 엔트리(#0) 위에 #1 트랩을 쌓아 첫 화면 back을 잡음
try{
  if(!(history.state && history.state.qcStep)){
    history.replaceState({qcBase:1}, '', location.pathname + location.search);
    history.pushState({qcStep:1}, '', location.pathname + location.search + '#1');
  }else if(history.state.qcStep!==1){ histReplace(1); }
}catch(e){}

(function setupInstallBanner(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if(isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
    && !window.MSStream;

  let deferredPrompt = null;
  let banner = null;

  function showBanner(html, onClick){
    if(banner) return;
    banner = document.createElement('div');
    banner.className = 'install-banner';
    banner.innerHTML = `
      <div class="install-banner-text">${html}</div>
      <button class="install-banner-close" aria-label="닫기">✕</button>
    `;
    document.body.appendChild(banner);
    banner.querySelector('.install-banner-close').onclick = ()=>{
      banner.remove(); banner = null;
      try{ localStorage.setItem('installBannerSnoozeAt', String(Date.now())); }catch(e){}
    };
    if(onClick){
      banner.addEventListener('click', (e)=>{
        if(e.target.closest('.install-banner-close')) return;
        onClick();
      });
    }
  }

  let dismissed = false;
  try{ const t = Number(localStorage.getItem('installBannerSnoozeAt')||0); dismissed = t>0 && (Date.now()-t) < 7*24*60*60*1000; }catch(e){}
  if(dismissed) return;

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    showBanner('📲 <b>홈 화면에 앱으로 추가</b>하기 — 탭하여 설치', async ()=>{
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      if(banner){ banner.remove(); banner=null; }
    });
  });

  if(isIOS){
    showBanner('📲 <b>홈 화면에 추가</b>: 하단 공유 버튼 <span style="font-weight:800">⬆️</span> → "홈 화면에 추가" 선택', null);
  }
})();

   새 버전 업데이트 알림
   network-first 서비스워커가 새 index.html을 조용히 받아와도,
   이미 열려있는 탭은 새로고침 전까지 옛 버전으로 남아있으므로
   현재 서버의 APP_VERSION과 비교해 알려준다.
   ========================================================= */
(function setupUpdateChecker(){
  let banner = null;

  function extractVersion(html){
    const m = html.match(/const APP_VERSION\s*=\s*'([^']+)'/);
    return m ? m[1] : null;
  }

  function showUpdateBanner(latest){
    if(banner) return;
    banner = document.createElement('div');
    banner.className = 'update-banner';
    banner.innerHTML = `
      <div class="update-banner-text">🔄 새 버전(<b>${latest}</b>)이 있습니다. 새로고침하면 최신 내용이 반영됩니다.</div>
      <button class="update-banner-btn">새로고침</button>
    `;
    document.body.appendChild(banner);
    banner.querySelector('.update-banner-btn').onclick = ()=>{ location.reload(); };
  }

  async function checkForUpdate(){
    try{
      const res = await fetch('./index.html', {cache:'no-store'});
      if(!res.ok) return;
      const html = await res.text();
      const latest = extractVersion(html);
      if(latest && latest !== APP_VERSION) showUpdateBanner(latest);
    }catch(e){ /* 오프라인 등 - 조용히 무시 */ }
  }

  window.addEventListener('load', ()=>{ setTimeout(checkForUpdate, 2000); });
  setInterval(checkForUpdate, 15*60*1000); // 탭을 오래 열어둔 경우 15분마다 재확인
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible') checkForUpdate();
  });
})();
</script>
